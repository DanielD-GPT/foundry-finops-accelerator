# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-finops-accelerator
metadata:
  template: foundry-finops-accelerator@1.0.0

services:
  cost-normalizer:
    project: ./src/cost-normalizer
    language: python
    host: function

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
    posix:
      shell: sh
      run: pwsh ./scripts/postprovision.ps1
