name: Validate accelerator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: instrumentation/typescript/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pip install -r requirements.txt
      - run: python scripts/build_dashboards.py
      - run: python scripts/validate_assets.py
      - run: pytest instrumentation/python src/cost-normalizer -q
      - run: az bicep build --file infra/main.bicep --outfile infra/main.json
      - run: dotnet test instrumentation/dotnet/FoundryFinOps.Tests/FoundryFinOps.Tests.csproj
      - run: npm ci
        working-directory: instrumentation/typescript
      - run: npm run build && npm test
        working-directory: instrumentation/typescript
